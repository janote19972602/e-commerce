<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce refactorizado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/grillaProductos.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/eventos.js"></script>    
</head>
<body>

    <header>
        <div id="navbar"></div>           
    </header>

    <main>
        <div class="container">
            <!-- aqui va a ir la grilla dinamica de productos -->
            <div id="grillaProductos" class="grilla-productos"></div>
        </div>
    </main>

    <div class="overlay " id="overlay"></div>
    <aside class="carrito-menu-lateral" id="menuLateral">
        <div class="carrito-contenidoProductos">
            <p id="cantidadProductos">0</p>
            <p>Productos en el carrito</p>
        </div>
        <div class="carrito-lista" id="listaCarrito"></div>
        <div class="carrito-acciones">
            <button id="btnVerCarrito" class="carrito-mostrar">Ver carrito</button>
        </div>
    </aside>

    <footer>
    </footer>

</html>
