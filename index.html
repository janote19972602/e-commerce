<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce refactorizado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/grillaProductos.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/eventosGlobal.js"></script>    
</head>
<body>

    <header>
        <div id="navbar"></div>           
    </header>

    <main>
        <div class="container">
            
            <div class="toolbar">
                <!-- Total de productos comprados -->
                <div class="toolbar-total-productos">
                    <span>30 productos comprados</span>
                </div>

                <!-- Buscador y Ordenador a la derecha -->
                <div class="toolbar-derecha">
                    <div class="toolbar-buscador">
                        <input id="buscador" type="text" placeholder="Buscar...">
                    </div>
                    <div class="toolbar-ordenador">
                        <select name="" id="">
                            <option value="">Ordenar</option>
                            <option value="">Precio de mayor a menor</option>
                        </select>
                    </div>
                </div>
            </div>



            <div id="grillaProductos" class="grilla-productos"></div>
        </div>
    </main>

        <div id="contenedorMenuLateral"></div>

    <footer>
    </footer>
    
</body>
</html>
